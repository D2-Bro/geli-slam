# Configuration of the Device
device_config:
  # Device Name
  device_name: "GelSight Mini"
  # Each pixel represents how many millimeters
  ppmm: 0.0634
  # Resized image width and height
  imgh: 240
  imgw: 320
  # Raw image width, height, and framerate
  raw_imgh: 2464
  raw_imgw: 3280
  framerate: 25
  # Process-wide Torch CPU intra-op threads for surface reconstruction.
  torch_num_threads: 4
  # ROS topic for the tactile image stream. The live streamer publishes "image".
  image_topic: "image"
  # Path to calibration model (absolute, or relative to this config file)
  # Calibration instruction: https://github.com/joehjhuang/gs_sdk/blob/master/calibration/README.md
  calibration_model_path: "/home/dongjae/dataset/GeLISLAM/nnmodel.pth"

# Enable subscription and buffering of calibrated IMU measurements. IMU-only
# coasting activates only after gelsight_T_imu is calibrated and supplied.
imu_config:
  # Reject discontinuous IMU intervals before contact optimization or recovery.
  max_sample_gap_s: 0.05
  # Requires GT IMU PoseStamped input and calibrated frontend VI.
  frontend_gt_previous_state_test:
    enabled: false
    previous_pose_from_gt: true
    previous_velocity_from_gt: true
    reference_pose_from_gt: true
    reset_marginal_prior: true
    # Keep pose/velocity at one time when toggling either GT input independently.
    previous_state_time: accepted_state
  # The calibrated VI world always uses gravity along -Z and zero first-contact position.
  # Opt-in stationary initialization before the first contact of each trial.
  # Overrides GT/fixed gravity and GT velocity initialization while enabled.
  # Requires IMU + frontend optimization + marginalization + calibrated T_GI.
  static_initialization:
    enabled: false
    window_s: 1.0
    min_samples: 50
    accel_std_threshold_mps2: 0.05
    gyro_std_threshold_rps: 0.005
    gyro_mean_threshold_rps: 0.05
    accel_mean_change_threshold_mps2: 0.1
    gravity_norm_tolerance_mps2: 0.3
    max_sample_gap_s: 0.05
    max_propagation_s: 5.0
    velocity_sigma_mps: 0.01
  # "recorded_source" requires recorded_source_bag_path and paired timing topics.
  timestamp_source: "header"
  recorded_source_bag_path: null
  # Positive relative objective weights for the joint frontend solve.
  dense_normalflow_residual_weight: 1.0
  # Huber threshold for each scaled three-component normal residual; 0 disables it.
  gtsam_vi_normal_huber_delta: 0.4
  # Only normal rows use Huber in steps 1..5; step 6 onward is least squares.
  gtsam_vi_normal_huber_iterations: 5
  # Mean height residual in the joint contact frontend; direct GelSight Z only.
  gtsam_vi_height_z_enabled: false
  # Sigma of the mean measurement in metres (initial value: 0.1 mm).
  # Do not divide by sqrt(pixel count): integrated height errors are correlated.
  gtsam_vi_height_z_sigma_m: 0.0001
  # Shared objective weight for the separate 9D IMU and 6D bias factors.
  imu_residual_weight: 1.0
  gtsam_vi_max_iterations: 10
  gtsam_vi_min_iterations: 7
  # Original NormalFlow thresholds in reference GelSight IC coordinates.
  # Z, velocity, bias and previous-state updates do not control convergence.
  gtsam_vi_rotation_stop_rad: 0.0001
  gtsam_vi_translation_stop_m: 0.00001  # XY norm, 0.01 mm
  # Reference-map IC Jacobian; contacts, coordinate mapping and weights update each iteration.
  # Set target_relinearized to compare with current-target normal derivatives.
  gtsam_vi_normal_linearization: "inverse_compositional"
  # Full undamped GN steps; IMU/bias/prior terms are relinearized each iteration.
  gtsam_integration_sigma_m: 0.0001
  enabled: true
  # Use a local normal-flow + native GTSAM IMU solve for each tracked frame.
  # It activates only after gelsight_T_imu is populated.
  frontend_optimization: true
  # pairwise: fixed visual reference, 15D retained navigation prior (legacy).
  # reference_marginalization: variable reference + 15D state, 21D retained/36D solve.
  # First contact pose is fixed: 9D initialization, 24D bootstrap solve, 15D retained.
  # After reference replacement: 15D retained/30D shared-pose solve. Backend map only.
  frontend_state_mode: "pairwise"
  # Shared native preintegration: midpoint only (half-step attitude). It averages
  # adjacent accel/gyro samples and composes rotations.
  # Covers VI prediction, recovery, no-contact coast and backend IMU factors.
  integration_method: "midpoint"
  # Set false to start each contact-frame solve from the previous VI state.
  # IMU preintegration still supplies the IMU factor in the solve.
  # With true, initial shared points < 10 retries once from the previous State.
  frontend_initialize_from_imu_preintegration: true
  # Use the IMU-predicted State directly. Skip optimization and marginal prior.
  # Skip SCR/CCS too; retain each valid IMU prediction for the next frame.
  # Requires frontend_optimization. IMU failure still rejects the target.
  # Overrides frontend_initialize_from_imu_preintegration and fixed/joint modes.
  frontend_imu_prediction_only: false
  # Fix the previous pose/velocity/bias and optimize only the target state.
  # When true, bypass joint marginalization and its carried prior.
  frontend_fix_previous_state: false
  # Joint previous/target state solve. Marginalize the previous 15D state.
  # The tracker commits the target prior only after its contact quality gate.
  gtsam_vi_marginalization: true
  # Initial accepted-state uncertainty in SI units; used at each VI restart.
  gtsam_vi_prior_rotation_sigma_rad: 0.01
  gtsam_vi_prior_translation_sigma_m: 0.0001
  gtsam_vi_prior_velocity_sigma_mps: 0.1
  gtsam_vi_prior_accel_bias_sigma_mps2: 0.1
  gtsam_vi_prior_gyro_bias_sigma_rps: 0.01
  # Hardware default: only valid when the tactile chart is level.
  frontend_gravity_initialization: "fixed_world_z"
  topic: "/imu/data"
  frame_id: "ebimu_link"
  # Add this value to each image timestamp before IMU integration. Positive
  # means that the matching IMU state occurs later on the IMU clock.
  image_to_imu_time_offset_s: 0.0
  # IMU-only motion is a short bridge, not an unbounded pose source.
  max_coast_duration_s: 1.0
  # Optional prediction-only velocity fit from recent accepted contact poses.
  # Requires sufficient continuous contact history; otherwise retain VI velocity.
  coast_velocity_fit:
    enabled: false
    model: "inertial_quadratic"
  gravity_mps2: 9.81
  # ROS sensor_msgs/Imu defines angular_velocity in rad/s; only rad_s is accepted.
  gyro_input_unit: "rad_s"
  # Reject a converted sample above this norm instead of integrating a likely
  # degree/radian mismatch. Set null only after validating the sensor range.
  gyro_max_rate_rad_s: 5.0
  buffer_max_samples: 6000
  # Noise density / bias random walk in SI units. Replace these conservative
  # defaults with the calibrated values from the IMU data sheet or Allan plot.
  accelerometer_noise_density: 0.02
  gyroscope_noise_density: 0.002
  accelerometer_bias_random_walk: 0.0002
  gyroscope_bias_random_walk: 0.00002
  # 4x4 T_GI: maps IMU coordinates into GelSight chart coordinates.  Keep null
  # until the physical mounting calibration and camera/IMU time alignment are known.
  gelsight_T_imu: null

# Configuration of how contact mask is thresholded
contact_mask_config:
  color_dist_threshold: 15
  height_threshold: 0.2

# GelSLAM configuration
gelslam_config:
  # Configuration of how GelSLAM tracks
  track_config:
    # Retain each rejected contact image as an IMU-predicted Frame for evaluation.
    # Requires a valid initialized VI state and continuous IMU coverage to the image.
    # Does not accept the prediction or add optimization keyframes. Default: false.
    keep_imu_only_frames: false
    # Write/publish normal RGB, contact cloud and correspondence debug images.
    # false skips their construction; tracking and frame/keyframe output continue.
    debug_visualization_enabled: true
    # Promote a valid contact frame after this image-time gap. 0 disables it.
    keyframe_max_interval_s: 0.5
    # Continuous-contact quality rejections: recover from IMU after this image-time gap.
    # Recontact or missing correspondences use valid IMU immediately, without this wait.
    contact_failure_keyframe_interval_s: 0.5
    # Sample at most 30 normal-flow pairs in the RViz Image panel.
    # This limit affects only the display. Set 0 to show all pairs.
    correspondence_max_lines: 30
    # DDS queue depth for device_config.image_topic. Keep 1 for lowest latency; increase only
    # when diagnosing dropped frames or accepting queued-frame latency.
    # IMU synchronization also keeps only the latest image waiting for IMU.
    image_queue_size: 1
    contact_threshold: 500
    scr_threshold: 0.3
    ccs_threshold: 0.7
  # Configuration of how GelSLAM builds pose graph and loop closure
  pose_graph_config:
    # 15D states: IMU pose, world velocity, accelerometer and gyroscope biases.
    # Local VI uses tactile/IMU observations; tracker poses only initialize it.
    # Separate global 15D PGO: full pose, world velocity and both IMU biases.
    # Raw IMU/bias factors connect all temporal pairs; recovery pairs omit pose odometry.
    # Odometry/registered-loop residuals remain 6D, with the sigmas below.
    # Same relative-pose sigmas as gelslam-origin, converted from mm to metres.
    loop_pgo_rotation_sigma_rad: 0.01
    loop_pgo_translation_sigma_m: 0.0001
    # Minimum data-time gap between loop-search targets; 0 searches every KF.
    # Skipped targets remain available as references. Not wall-clock throttling.
    loop_search_min_interval_s: 0.0
    # Exclude the previous N keyframes from loop candidates, across trial boundaries.
    # K_t skips K_(t-1)..K_(t-N); 0 disables this candidate exclusion.
    loop_search_exclude_recent_keyframes: 5
    # IMU/bias noise densities use imu_config; reject uncovered/gapped intervals.
    imu_max_sample_gap_s: 0.05
    initial_velocity_sigma_mps: 0.1
    initial_accel_bias_sigma_mps2: 0.1
    initial_gyro_bias_sigma_rps: 0.01
    max_iterations: 10
    coverage_graph_overlap_threshold: 50
    min_sift_inliers: 8
    scr_threshold: 0.3
    ccs_threshold: 0.7

# Enable only when an externally measured PoseStamped ground-truth topic is
# available.  It does not feed back into tracking or pose-graph optimization.
trajectory_evaluation:
  enabled: false
  ground_truth_pose_topic: "/ground_truth/gel_pose"
  timestamp_tolerance_s: 0.03
